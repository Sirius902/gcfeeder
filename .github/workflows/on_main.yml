name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target-os: linux
            build-target: x86_64-unknown-linux-gnu
            artifacts: |
              target/x86_64-unknown-linux-gnu/debug/gcfeeder
          - os: windows-latest
            target-os: windows
            build-target: x86_64-pc-windows-msvc
            artifacts: |
              target/x86_64-pc-windows-msvc/debug/gcfeeder.exe
              target/x86_64-pc-windows-msvc/debug/gcfeeder.pdb
    env:
      CARGO_BUILD_TARGET: ${{ matrix.build-target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y libgtk-3-dev libxdo-dev libappindicator3-dev
      - name: Build
        run: cargo build
      - name: Run Tests
        run: cargo test
      - name: Clippy Lints
        run: cargo clippy
      - name: Upload gcfeeder
        uses: actions/upload-artifact@v4
        with:
          name: gcfeeder-${{ matrix.target-os }}
          path: ${{ matrix.artifacts }}
