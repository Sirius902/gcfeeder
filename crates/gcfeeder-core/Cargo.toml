[package]
name = "gcfeeder-core"
description.workspace = true
version.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
conv = "0.3"
crossbeam = "0.8"
enclose = "1"
enum-iterator = "2"
enum_dispatch = "0.3"
nalgebra = "0.33"
once_cell = "1"
rayon = "1"
rusb = "0.9"
thiserror = "2"

[dependencies.gcinput]
path = "../../lib/gcinput"
features = ["nalgebra"]

[dependencies.log]
version = "0.4"
features = ["std"]

[dependencies.serde]
version = "1"
features = ["derive"]

[target.'cfg(windows)'.dependencies.vigem-client]
version = "0.1"
features = ["unstable_xtarget_notification"]

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"
nix = { version = "0.29", features = ["event", "fs"] }
