[package]
description.workspace = true
edition.workspace = true
name = "gcfeeder-core"
repository.workspace = true
version.workspace = true

[dependencies]
conv = "0.3"
crossbeam = "0.8"
enclose = "1"
enum-iterator = "2"
enum_dispatch = "0.3"
nalgebra = "0.33"
once_cell = "1"
rayon = "1"
rusb = "0.9"
thiserror = "2"

[dependencies.gcinput]
features = ["nalgebra"]
path = "../gcinput"

[dependencies.log]
features = ["std"]
version = "0.4"

[dependencies.serde]
features = ["derive"]
version = "1"

[target.'cfg(windows)'.dependencies.vigem-client]
features = ["unstable_xtarget_notification"]
version = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
nix = { version = "0.29", features = ["event", "fs"] }
