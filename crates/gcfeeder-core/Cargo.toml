[package]
name = "gcfeeder-core"
version = "0.0.0"
repository = "https://github.com/Sirius902/gcfeeder/"
edition = "2021"

[dependencies]
conv = "0.3"
crossbeam = "0.8"
enclose = "1.1"
enum-iterator = "1.2"
enum_dispatch = "0.3"
nalgebra = "0.32"
once_cell = "1.14"
rayon = "1.5"
rusb = "0.9"
thiserror = "1.0"

[dependencies.gcinput]
path = "../../lib/gcinput"
features = ["nalgebra"]

[dependencies.log]
version = "0.4"
features = ["std"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[target.'cfg(windows)'.dependencies.vigem-client]
version = "0.1"
features = ["unstable_xtarget_notification"]

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"
nix = { version = "0.29", features = ["event", "fs"] }
