[package]
name = "gcfeeder"
version = "3.0.1"
repository = "https://github.com/Sirius902/gcfeeder/"
edition = "2021"

[dependencies]
bincode = "1"
crossbeam = "0.8"
dirs = "5"
egui = "0.29"
enum-iterator = "2"
nalgebra = "0.33"
once_cell = "1"
rayon = "1"
rusb = "0.9"
thiserror = "2"
toml = "0.8"
winit = "0.30"

[dependencies.gcinput]
path = "../../lib/gcinput"

[dependencies.panic-log]
path = "../../lib/panic-log"

[dependencies.gcfeeder-core]
path = "../gcfeeder-core"

[dependencies.eframe]
version = "0.29"
default-features = false
features = ["accesskit", "default_fonts", "wgpu"]

[dependencies.image]
version = "0.25"
default-features = false
features = ["png"]

[dependencies.log]
version = "0.4"
features = ["std"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.time]
version = "0.3"
features = ["macros", "formatting", "local-offset"]

[target.'cfg(windows)'.dependencies.trayicon]
version = "0.1"
features = ["crossbeam-channel"]

[build-dependencies.vergen]
version = "8"
default-features = false
features = ["git", "gitcl"]

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.build-dependencies.image]
version = "0.25"
default-features = false
features = ["png", "ico"]
