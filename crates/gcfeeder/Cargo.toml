[package]
authors.workspace = true
description.workspace = true
edition.workspace = true
name = "gcfeeder"
readme.workspace = true
repository.workspace = true
version.workspace = true

[build-dependencies.git2]
default-features = false
features = []
optional = true
version = "0.20"

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3"
image = { version = "0.25", features = [
  "png",
  "ico",
], default-features = false }

[dependencies]
bincode = "1"
crossbeam = "0.8"
directories = "6"
eframe = { version = "0.31", features = [
  "accesskit",
  "default_fonts",
  "wgpu",
], default-features = false }
egui = "0.31"
enum-iterator = "2"
gcfeeder-core = { path = "../gcfeeder-core" }
gcinput = { path = "../gcinput" }
image = { version = "0.25", features = ["png"], default-features = false }
log = { version = "0.4", features = ["std"] }
nalgebra = "0.33"
once_cell = "1"
panic-log = { path = "../panic-log" }
rayon = "1"
rusb = "0.9"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
time = { version = "0.3", features = ["macros", "formatting", "local-offset"] }
toml = "0.8"
tray-icon = "0.19"
winit = "0.30"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.60", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", default-features = false }

[features]
default = ["git-version"]
git-version = ["dep:git2"]
