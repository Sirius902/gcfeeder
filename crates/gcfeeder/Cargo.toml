[package]
description.workspace = true
edition.workspace = true
name = "gcfeeder"
repository.workspace = true
version.workspace = true

[dependencies]
bincode = "1"
crossbeam = "0.8"
dirs = "6"
egui = "0.30"
enum-iterator = "2"
nalgebra = "0.33"
once_cell = "1"
rayon = "1"
rusb = "0.9"
thiserror = "2"
toml = "0.8"
winit = "0.30"

[dependencies.gcinput]
path = "../gcinput"

[dependencies.panic-log]
path = "../panic-log"

[dependencies.gcfeeder-core]
path = "../gcfeeder-core"

[dependencies.eframe]
default-features = false
features = ["accesskit", "default_fonts", "wgpu"]
version = "0.30"

[dependencies.image]
default-features = false
features = ["png"]
version = "0.25"

[dependencies.log]
features = ["std"]
version = "0.4"

[dependencies.serde]
features = ["derive"]
version = "1"

[dependencies.time]
features = ["macros", "formatting", "local-offset"]
version = "0.3"

[target.'cfg(windows)'.dependencies.trayicon]
features = ["crossbeam-channel"]
version = "0.1"

[build-dependencies.vergen-git2]
default-features = false
features = []
version = "1"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.build-dependencies.image]
default-features = false
features = ["png", "ico"]
version = "0.25"
