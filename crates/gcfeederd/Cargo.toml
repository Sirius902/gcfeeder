[package]
authors.workspace = true
description.workspace = true
edition.workspace = true
license.workspace = true
name = "gcfeederd"
readme.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
console-subscriber = { version = "0.4", optional = true }
directories = "6"
gcfeeder-core = { path = "../gcfeeder-core" }
gcinput = { path = "../gcinput" }
image = { version = "0.25", features = ["png"], default-features = false }
nusb = "0.1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.20"
winit = { version = "0.30", features = ["x11"], default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0"
gtk = { version = "0.18", default-features = false }

[features]
default = []
tokio-console = ["dep:console-subscriber"]
